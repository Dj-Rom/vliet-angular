<head><base href="/vliet-angular/">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      padding: 60px;
      max-width: 1000px;
    }

    .logo {
      font-size: 80px;
      font-weight: 900;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 5px;
      background: linear-gradient(45deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .truck {
      font-size: 100px;
      margin-bottom: 20px;
    }

    .tagline {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 40px;
      line-height: 1.3;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-bottom: 40px;
    }

    .feature {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkmark {
      color: #FFD700;
      font-size: 32px;
    }

    .url {
      font-size: 32px;
      color: #FFD700;
      font-weight: 700;
      margin-top: 30px;
    }
  </style>
