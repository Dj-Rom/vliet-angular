<section class="select-vehicle-number">
  <header class="header-select-vechicle-number">
    <nav class="nav-back">
      <button class="backBtn" (click)="closeModal()">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20L0 10L10 0L11.775 1.775L3.55 10L11.775 18.225L10 20Z" fill="white" />
        </svg>

      </button>
      <span>{{ this.currentType == "truck" ? "Wybierz ciągnik" : "Wybierz naczepę" }}</span>
      <span></span>
    </nav>
    <div class="filter">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M13.8333 15L8.58333 9.75C8.16667 10.0833 7.6875 10.3472 7.14583 10.5417C6.60417 10.7361 6.02778 10.8333 5.41667 10.8333C3.90278 10.8333 2.62153 10.309 1.57292 9.26042C0.524306 8.21181 0 6.93056 0 5.41667C0 3.90278 0.524306 2.62153 1.57292 1.57292C2.62153 0.524306 3.90278 0 5.41667 0C6.93056 0 8.21181 0.524306 9.26042 1.57292C10.309 2.62153 10.8333 3.90278 10.8333 5.41667C10.8333 6.02778 10.7361 6.60417 10.5417 7.14583C10.3472 7.6875 10.0833 8.16667 9.75 8.58333L15 13.8333L13.8333 15ZM5.41667 9.16667C6.45833 9.16667 7.34375 8.80208 8.07292 8.07292C8.80208 7.34375 9.16667 6.45833 9.16667 5.41667C9.16667 4.375 8.80208 3.48958 8.07292 2.76042C7.34375 2.03125 6.45833 1.66667 5.41667 1.66667C4.375 1.66667 3.48958 2.03125 2.76042 2.76042C2.03125 3.48958 1.66667 4.375 1.66667 5.41667C1.66667 6.45833 2.03125 7.34375 2.76042 8.07292C3.48958 8.80208 4.375 9.16667 5.41667 9.16667Z"
          fill="#9BA4AE" />
      </svg>
      <input type="text" placeholder="" (input)="onFilter($event)" value="{{ filterValue() }}" />
      <svg (click)="clearFilter()" width="24" height="24" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"
          fill="#9BA4AE" />
      </svg>

    </div>
  </header>
  <ul>
    @for (item of vehicleFleetFiltered(); track item.id || item.vehicle_number) {
    <li (click)="selectNumber(item.vehicle_number)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M4.5 15C3.875 15 3.34375 14.7813 2.90625 14.3438C2.46875 13.9062 2.25 13.375 2.25 12.75H0.75V4.5C0.75 4.0875 0.896875 3.73438 1.19063 3.44063C1.48438 3.14687 1.8375 3 2.25 3H12.75V6H15L17.25 9V12.75H15.75C15.75 13.375 15.5313 13.9062 15.0938 14.3438C14.6563 14.7813 14.125 15 13.5 15C12.875 15 12.3438 14.7813 11.9062 14.3438C11.4688 13.9062 11.25 13.375 11.25 12.75H6.75C6.75 13.375 6.53125 13.9062 6.09375 14.3438C5.65625 14.7813 5.125 15 4.5 15ZM4.5 13.5C4.7125 13.5 4.89062 13.4281 5.03438 13.2844C5.17813 13.1406 5.25 12.9625 5.25 12.75C5.25 12.5375 5.17813 12.3594 5.03438 12.2156C4.89062 12.0719 4.7125 12 4.5 12C4.2875 12 4.10938 12.0719 3.96563 12.2156C3.82188 12.3594 3.75 12.5375 3.75 12.75C3.75 12.9625 3.82188 13.1406 3.96563 13.2844C4.10938 13.4281 4.2875 13.5 4.5 13.5ZM2.25 11.25H2.85C3.0625 11.025 3.30625 10.8438 3.58125 10.7063C3.85625 10.5688 4.1625 10.5 4.5 10.5C4.8375 10.5 5.14375 10.5688 5.41875 10.7063C5.69375 10.8438 5.9375 11.025 6.15 11.25H11.25V4.5H2.25V11.25ZM13.5 13.5C13.7125 13.5 13.8906 13.4281 14.0344 13.2844C14.1781 13.1406 14.25 12.9625 14.25 12.75C14.25 12.5375 14.1781 12.3594 14.0344 12.2156C13.8906 12.0719 13.7125 12 13.5 12C13.2875 12 13.1094 12.0719 12.9656 12.2156C12.8219 12.3594 12.75 12.5375 12.75 12.75C12.75 12.9625 12.8219 13.1406 12.9656 13.2844C13.1094 13.4281 13.2875 13.5 13.5 13.5ZM12.75 9.75H15.9375L14.25 7.5H12.75V9.75Z"
          fill="#9BA4AE" />
      </svg>
      {{ item.vehicle_number }}
    </li>
    }
  </ul>
  <app-add-new-vehicle *ngIf="waybillsService.isOpenModalFormForAddNewVehicle()" [initialType]="currentType"
    (closeModal)="onNewVehicleAdded($event)">
  </app-add-new-vehicle>

  <button class="btn-add-new" *ngIf="!waybillsService.isOpenModalFormForAddNewVehicle()" (click)="addNewVehicle()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11 13H5V11H11V5H13V11H19V13H13V19H11V13Z" fill="white" />
    </svg>
  </button>
</section>
