<div class="calendar" style="width: 96vw; max-width: 600px; margin: 0">
  <!-- HEADER -->
  <div class="calendar-header">
    <button (click)="prevMonth()" class="arrow">‹</button>

    <div class="selectors">
      <select
        class="select-wrapper"
        [value]="currentMonth()"
        (change)="setMonth(+$any($event.target).value)"
      >
        <option *ngFor="let m of months; let i = index" [value]="i" [selected]="i === currentMonth()">
          {{ m }}
        </option>
      </select>

      <span class="year">
        {{ currentYear() }}
      </span>
    </div>

    <button (click)="nextMonth()" class="arrow">›</button>
  </div>

  <!-- WEEKDAYS -->
  <div class="weekdays">
    <span *ngFor="let d of ['Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob', 'Niedz']">
      {{ d }}
    </span>
  </div>

  <!-- DAYS -->
  <div class="days">
    <div
      *ngFor="let day of days()"
      class="day"
      [class.today]="isToday(day.date)"
      [class.selected]="isSelected(day.date)"
      [class.range-start]="isRangeStart(day.date)"
      [class.range-end]="isRangeEnd(day.date)"
      [class.in-range]="isInRange(day.date)"
      (click)="selectDay(day)"
    >
      {{ day.date.getDate() }}
    </div>
  </div>
  <button class="save-btn" (click)="save()">
    {{ rangeAvailable ? 'Pobierz raport' : 'Zapisz' }}
  </button>
</div>
