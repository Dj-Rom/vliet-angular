<div class="calendar" style="width: 96vw; max-width: 600px; margin: 0">
  <button class="close-btn" (click)="close()" type="button" aria-label="Zamknij">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"
        fill="#9BA4AE" />
    </svg>
  </button>
  <!-- HEADER -->
  <div class="calendar-header">
    <button (click)="prevMonth()" class="arrow">‹</button>

    <div class="selectors">
      <select class="select-wrapper" [value]="currentMonth()" (change)="setMonth(+$any($event.target).value)">
        <option *ngFor="let m of months; let i = index" [value]="i" [selected]="i === currentMonth()">
          {{ m }}
        </option>
      </select>

      <span class="year">
        {{ currentYear() }}
      </span>
    </div>

    <button (click)="nextMonth()" class="arrow">›</button>
  </div>

  <!-- WEEKDAYS -->
  <div class="weekdays">
    <span *ngFor="let d of ['Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob', 'Niedz']">
      {{ d }}
    </span>
  </div>

  <!-- DAYS -->
  <div class="days">
    <div *ngFor="let day of days()" class="day" [class.muted]="!day.inMonth" [class.today]="isToday(day.date)"
      [class.selected]="!rangeAvailable && isSelected(day.date)"
      [class.range-start]="rangeAvailable && isRangeStart(day.date)"
      [class.range-end]="rangeAvailable && isRangeEnd(day.date)"
      [class.range-single]="rangeAvailable && isRangeSingle(day.date)"
      [class.in-range]="rangeAvailable && isInRange(day.date)" (click)="selectDay(day)">
      <span class="day-content">{{ day.date.getDate() }}</span>
    </div>
  </div>
  <button class="save-btn" (click)="save()">
    {{ rangeAvailable ? 'Pobierz raport' : 'Zapisz' }}
  </button>
</div>
