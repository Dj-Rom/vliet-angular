<div class="time-picker">
  <button class="close-btn" (click)="close()" type="button" aria-label="Zamknij">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"
        fill="#9BA4AE" />
    </svg>
  </button>
  <div class="wheels">
    <!-- HOURS -->
    <div class="wheel-container">
      <div class="wheel" #hoursWheel (scroll)="onHourScroll()">
        <div class="wheel-item" *ngFor="let h of hours" [class.active]="h === selectedHour()">
          {{ h }}
        </div>
      </div>
    </div>

    <div class="colon">:</div>

    <!-- MINUTES -->
    <div class="wheel-container">
      <div class="wheel" #minutesWheel (scroll)="onMinuteScroll()">
        <div class="wheel-item" *ngFor="let m of minutes" [class.active]="m === selectedMinute()">
          {{ m }}
        </div>
      </div>
    </div>
  </div>

  <button class="save-btn" (click)="save()">Zapisz</button>
</div>
