      fill="#9BA4AE" />

      <h5 class="font400size16">{{ title }}</h5>
      <span class="font400size12">{{ date }}</span>

  <button class="block font400size16 border" [disabled]="!hasItemsToSend()"
    [style.opacity]="hasItemsToSend() ? '1' : '0.45'" [style.cursor]="hasItemsToSend() ? 'pointer' : 'not-allowed'"
    (click)="onSend()">
    <div> <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M7 12V3.85L4.4 6.45L3 5L8 0L13 5L11.6 6.45L9 3.85V12H7ZM2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V11H2V14H14V11H16V14C16 14.55 15.8042 15.0208 15.4125 15.4125C15.0208 15.8042 14.55 16 14 16H2Z"
          fill="#9BA4AE" />
      </svg></div>
    Wyślij
  </button>

  <button class="block font400size16" (click)="onDelete()">
    <div> <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M3 18C2.45 18 1.97917 17.8042 1.5875 17.4125C1.19583 17.0208 1 16.55 1 16V3H0V1H5V0H11V1H16V3H15V16C15 16.55 14.8042 17.0208 14.4125 17.4125C14.0208 17.8042 13.55 18 13 18H3ZM13 3H3V16H13V3ZM5 14H7V5H5V14ZM9 14H11V5H9V14Z"
          fill="#9BA4AE" />
