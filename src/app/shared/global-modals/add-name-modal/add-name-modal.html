<section
  class="modal-window"
  style="display: flex; justify-content: center; flex-direction: column"
>
  <h2 class="font400size16 mt16">{{ title }}</h2>
  <input type="text" [(ngModel)]="name" class="font400size16" />
  <div class="groupBtn mt6">
    <button class="font500size16" (click)="cancel()">Anuluj</button>
    <button class="font600size16 createBtn" (click)="create()" [disabled]="!name">Utwórz</button>
  </div>
</section>
