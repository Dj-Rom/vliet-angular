<div class="update-backdrop" *ngIf="updateService.isUpdateAvailable()">
  <div class="update-dialog" [class.force-update]="updateService.isForceUpdate()">
    <div class="rocket-icon-wrapper">
      <span class="rocket-badge">🚀</span>
      <div class="pulse-ring"></div>
    </div>

    <div class="update-content">
      <div class="version-tag">Dostępna nowa wersja: <strong>v{{ updateService.remoteVersion() }}</strong></div>
      <h2 class="update-title">Zaktualizuj aplikację</h2>
      <p class="update-desc">{{ updateService.updateMessage() }}</p>

      <div class="version-diff">
        <span class="curr-ver">Twoja wersja: v{{ updateService.currentVersion }}</span>
        <span class="arrow">➔</span>
        <span class="new-ver">Nowa: v{{ updateService.remoteVersion() }}</span>
      </div>
    </div>

    <div class="update-actions">
      <button class="btn-update-now" (click)="updateNow()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        <span>Zaktualizuj teraz</span>
      </button>

      <button *ngIf="!updateService.isForceUpdate()" class="btn-update-later" (click)="later()">
        Przypomnij później
      </button>
    </div>
  </div>
</div>
